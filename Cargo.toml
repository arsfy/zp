[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["third_party"]
default-members = ["crates/zp-app"]

[workspace.package]
version = "0.1.1-rc.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates (others are added as they gain dependents)
zp-agent = { path = "crates/zp-agent" }
zp-ai = { path = "crates/zp-ai" }
zp-core = { path = "crates/zp-core" }
zp-mcp = { path = "crates/zp-mcp" }
zp-session = { path = "crates/zp-session" }
zp-tools = { path = "crates/zp-tools" }

# GPUI Community Edition, pinned to a specific revision because the API moves fast.
# The library crate is published as `gpui-ce` but its lib name is `gpui`.
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "f388375d03e63d75811fa1cca3a563203b920d98" }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce", rev = "f388375d03e63d75811fa1cca3a563203b920d98", features = ["font-kit", "wayland", "x11"] }
gpui_elements = { package = "gpui_ce_elements", git = "https://github.com/gpui-ce/gpui-ce", rev = "f388375d03e63d75811fa1cca3a563203b920d98" }
gpui_tokio = { package = "gpui_ce_tokio", git = "https://github.com/gpui-ce/gpui-ce", rev = "f388375d03e63d75811fa1cca3a563203b920d98" }

# Common
alacritty_terminal = "0.26"
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
globset = "0.4"
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
nix = { version = "0.32", default-features = false, features = ["signal", "process"] }
notify = "8.2"
regex = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ring = "0.17"
semver = "1"
sha2 = "0.11"
similar = "3"
uuid = { version = "1", features = ["v4", "v7"] }
tempfile = "3"
trash = "5"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# gpui-ce's text input with a local fix for IME window placement (see the README there).
[patch."https://github.com/gpui-ce/gpui-ce"]
gpui_ce_elements = { path = "third_party/gpui_ce_elements" }
