# A copy of gpui-ce's `crates/gpui_elements` at rev f388375d03e63d75811fa1cca3a563203b920d98,
# used through `[patch]` in the workspace manifest. See README.md for the local change.

[package]
name = "gpui_ce_elements"
version = "0.4.0"
description = "A community fork of Zed's GPU-accelerated UI framework"
edition = "2024"
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[dependencies]
derive_setters = "0.1.9"
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "f388375d03e63d75811fa1cca3a563203b920d98", default-features = false }
palette = { version = "0.7.6", features = ["serializing"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
unicode-segmentation = "1.10"
