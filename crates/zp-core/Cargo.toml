[package]
name = "zp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
futures.workspace = true
reqwest.workspace = true
ring.workspace = true
semver.workspace = true
ignore.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zp-agent.workspace = true
zp-ai.workspace = true
zp-session.workspace = true
zp-tools.workspace = true

[features]
# Lets update tests serve packages from a plain-HTTP loopback server.
test-support = []

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }
