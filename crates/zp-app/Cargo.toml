[package]
name = "zp-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "zp"
path = "src/main.rs"

[dependencies]
alacritty_terminal.workspace = true
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_elements.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
ignore.workspace = true
notify.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true
serde_json.workspace = true
syntect.workspace = true
tracing.workspace = true
two-face.workspace = true
trash.workspace = true
zp-agent.workspace = true
zp-ai.workspace = true
zp-core.workspace = true
zp-mcp.workspace = true
zp-session.workspace = true
zp-tools.workspace = true
tempfile.workspace = true
tokio-util.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDocumentController"] }
url = "2"

[features]
# `zp --visual-tests DIR`: render scripted scenarios off-screen and save screenshots.
visual-tests = ["gpui/test-support", "gpui_platform/test-support"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
zp-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread"] }
