[package]
name = "zp-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "zp"
path = "src/main.rs"

[dependencies]
alacritty_terminal.workspace = true
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_elements.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
pulldown-cmark.workspace = true
serde_json.workspace = true
tracing.workspace = true
trash.workspace = true
zp-agent.workspace = true
zp-ai.workspace = true
zp-core.workspace = true
zp-mcp.workspace = true
zp-session.workspace = true
zp-tools.workspace = true
tempfile = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"] }

[features]
# `zp --visual-tests DIR`: render scripted scenarios off-screen and save screenshots.
visual-tests = ["gpui/test-support", "gpui_platform/test-support", "dep:tempfile"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread"] }
